<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="player-container">
        <h2 id="lecture-title"></h2>
        <iframe id="lecture-frame" frameborder="0"></iframe>
        <div class="player-buttons">
            <a id="notes-btn" class="btn" target="_blank">📄 Open Notes</a>
            <a id="dpp-btn" class="btn" target="_blank">📝 Open DPP</a>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.getElementById("lecture-title").textContent = `${getQueryParam("subject")} - ${getQueryParam("unit")} - ${getQueryParam("lecture")}`;
        document.getElementById("lecture-frame").src = getQueryParam("video");
        document.getElementById("notes-btn").href = getQueryParam("notes");
        document.getElementById("dpp-btn").href = getQueryParam("dpp");
    </script>

</body>
</html>
